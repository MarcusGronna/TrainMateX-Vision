# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - trainmatex-vision-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        working-directory: ./backend/TrainMateX.Api
        run: dotnet restore

      - name: Build with dotnet
        working-directory: ./backend/TrainMateX.Api
        run: dotnet build --configuration Release

      - name: dotnet publish
        working-directory: ./backend/TrainMateX.Api
        run: dotnet publish TrainMateX.Api/TrainMateX.Api.csproj -c Release -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: backend/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./api-files
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DE7A1FA951194E45A91B1B4EE2BEE4DA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7ED65E59C2004E7DAC5BCF66BBB82955 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_12EAEFD53F794B1A987A1113AF990F87 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'trainmatex-vision-api'
          slot-name: 'Production'
          package: ./api-files
          